[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tokio-tungstenite = "0.26"
